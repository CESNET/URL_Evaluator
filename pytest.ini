[pytest]
testpaths = tests
pythonpath = .
# --allow-hosts (pytest-socket): any connection outside localhost fails the
# test, so a forgotten mock never reaches VirusTotal, Hybrid Analysis, ...
# Live tests lift the restriction (see tests/conftest.py).
addopts = -ra --strict-markers --allow-hosts=127.0.0.1,::1
markers =
    slow: uses real Magika or larger payloads
    integration: multiple modules together (real DB + FS + local HTTP)
    live: talks to real external APIs (needs --run-live and API keys in env)
    real_sleep: keep the real time.sleep (default is a recorded no-op)
